<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpoilerFree ⚽</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SpoilerFree">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f; --surface: #13131a; --card: #1a1a24; --card-hover: #21212e;
      --border: #2a2a3a; --accent: #00e5a0; --text: #e8e8f0; --muted: #6b6b80; --danger: #ff4757;
      --live: #ff6b6b;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:'Heebo',sans-serif; min-height:100vh; overflow-x:hidden; }
    body::before { content:''; position:fixed; top:-50%; right:-20%; width:600px; height:600px; background:radial-gradient(circle,rgba(0,229,160,0.04) 0%,transparent 70%); pointer-events:none; z-index:0; }

    header { padding:1.5rem 2rem 1rem; border-bottom:1px solid var(--border); position:relative; z-index:1; }
    .header-inner { max-width:960px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
    .logo { font-family:'Bebas Neue',sans-serif; font-size:2rem; letter-spacing:2px; color:var(--accent); line-height:1; }
    .logo span { color:var(--muted); font-size:0.8rem; font-family:'Heebo',sans-serif; font-weight:300; display:block; letter-spacing:4px; text-transform:uppercase; margin-top:2px; }

    .league-tabs { display:flex; gap:0.5rem; flex-wrap:wrap; padding:1rem 2rem; max-width:960px; margin:0 auto; position:relative; z-index:1; }
    .tab { padding:0.4rem 1rem; border-radius:100px; border:1px solid var(--border); background:transparent; color:var(--muted); font-family:'Heebo',sans-serif; font-size:0.85rem; cursor:pointer; transition:all 0.2s; white-space:nowrap; }
    .tab:hover { border-color:var(--accent); color:var(--accent); }
    .tab.active { background:var(--accent); border-color:var(--accent); color:#000; font-weight:700; }

    .matchday-nav { max-width:960px; margin:0 auto; padding:0 2rem 1rem; display:flex; align-items:center; gap:0.75rem; position:relative; z-index:1; }
    .matchday-nav.hidden { display:none; }
    .md-btn { background:transparent; border:1px solid var(--border); color:var(--muted); font-family:'Heebo',sans-serif; font-size:0.85rem; padding:0.4rem 0.9rem; border-radius:8px; cursor:pointer; transition:all 0.2s; }
    .md-btn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
    .md-btn:disabled { opacity:0.3; cursor:default; }
    .md-label { font-family:'Bebas Neue',sans-serif; font-size:1.1rem; color:var(--text); letter-spacing:1px; min-width:90px; text-align:center; }
    .md-select { background:var(--surface); border:1px solid var(--border); color:var(--text); font-family:'Heebo',sans-serif; font-size:0.85rem; padding:0.35rem 0.7rem; border-radius:8px; cursor:pointer; outline:none; }

    main { max-width:960px; margin:0 auto; padding:0 2rem 4rem; position:relative; z-index:1; }
    .status-bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.25rem; flex-wrap:wrap; gap:0.5rem; }
    .match-count { font-size:0.8rem; color:var(--muted); letter-spacing:1px; text-transform:uppercase; }
    .refresh-btn { background:transparent; border:1px solid var(--border); color:var(--muted); font-family:'Heebo',sans-serif; font-size:0.8rem; padding:0.3rem 0.8rem; border-radius:6px; cursor:pointer; transition:all 0.2s; }
    .refresh-btn:hover { border-color:var(--accent); color:var(--accent); }
    .refresh-btn:disabled { opacity:0.4; cursor:default; }
    .sync-note { font-size:0.72rem; color:var(--muted); margin-inline-start:auto; margin-inline-end:0.75rem; }

    .date-group { margin-bottom:1.75rem; }
    .date-label { font-size:0.75rem; color:var(--muted); letter-spacing:3px; text-transform:uppercase; padding:0.4rem 0; margin-bottom:0.6rem; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:0.75rem; }
    .date-label .weekday { color:var(--accent); font-weight:700; }
    .date-label .is-today { background:var(--accent); color:#000; font-size:0.65rem; padding:0.1rem 0.5rem; border-radius:100px; font-weight:900; }

    .match-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:0.9rem 1.25rem; margin-bottom:0.5rem; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:1rem; cursor:pointer; transition:all 0.2s; position:relative; overflow:hidden; }
    .match-card::before { content:''; position:absolute; right:0; top:0; bottom:0; width:3px; background:var(--border); transition:background 0.2s; }
    .match-card:hover { background:var(--card-hover); border-color:rgba(0,229,160,0.3); transform:translateX(-2px); }
    .match-card:hover::before { background:var(--accent); }
    .match-card.is-over { border-color:rgba(0,229,160,0.12); }
    .match-card.is-live { border-color:rgba(255,107,107,0.4); }
    .match-card.is-live::before { background:var(--live); }
    .highlight-badge { position:absolute; left:1rem; top:50%; transform:translateY(-50%); font-size:0.68rem; color:var(--accent); letter-spacing:1px; background:rgba(0,229,160,0.08); padding:0.2rem 0.6rem; border-radius:100px; border:1px solid rgba(0,229,160,0.25); }
    .live-badge { position:absolute; left:1rem; top:50%; transform:translateY(-50%); font-size:0.68rem; color:var(--live); letter-spacing:1px; background:rgba(255,107,107,0.08); padding:0.2rem 0.6rem; border-radius:100px; border:1px solid rgba(255,107,107,0.25); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

    .team { display:flex; flex-direction:column; gap:0.1rem; }
    .team.home { text-align:right; }
    .team.away { text-align:left; }
    .team-name { font-size:0.95rem; font-weight:700; line-height:1.2; }
    .match-meta { text-align:center; display:flex; flex-direction:column; align-items:center; gap:0.25rem; min-width:65px; }
    .match-time { font-family:'Bebas Neue',sans-serif; font-size:1.2rem; color:var(--accent); letter-spacing:1px; line-height:1; }
    .match-time.past { color:var(--muted); }
    .match-time.live { color:var(--live); }
    .match-vs { font-size:0.6rem; color:var(--muted); letter-spacing:2px; }
    .venue { font-size:0.65rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:110px; }

    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:1000; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.3s; }
    .modal-overlay.open { opacity:1; pointer-events:all; }
    .modal { width:90vw; max-width:900px; background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; transform:translateY(20px); transition:transform 0.3s; }
    .modal-overlay.open .modal { transform:translateY(0); }
    .modal-header { padding:1rem 1.25rem; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); }
    .modal-title { font-size:1rem; font-weight:700; }
    .modal-close { background:transparent; border:none; color:var(--muted); font-size:1.4rem; cursor:pointer; line-height:1; padding:0.2rem 0.5rem; border-radius:6px; transition:all 0.2s; }
    .modal-close:hover { color:var(--text); background:var(--border); }

    .video-container { position:relative; padding-bottom:56.25%; height:0; background:#000; }
    .video-container iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:none; }

    .spoiler-shield { position:absolute; inset:0; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1rem; z-index:10; padding:2rem; }
    .shield-icon { font-size:3rem; }
    .shield-text { font-size:1rem; color:var(--muted); text-align:center; }
    .shield-note { font-size:0.75rem; color:var(--muted); opacity:0.7; }
    .sources-row { display:flex; gap:0.75rem; flex-wrap:wrap; justify-content:center; margin-top:0.5rem; }

    .play-btn { background:var(--accent); color:#000; border:none; padding:0.7rem 1.5rem; border-radius:100px; font-family:'Heebo',sans-serif; font-size:0.9rem; font-weight:700; cursor:pointer; transition:all 0.2s; white-space:nowrap; }
    .play-btn:hover { transform:scale(1.05); }
    .play-btn.extended { background:transparent; border:2px solid var(--accent); color:var(--accent); }
    .play-btn.extended:hover { background:rgba(0,229,160,0.1); }

    .retry-btn { background:transparent; border:1px solid var(--border); color:var(--muted); padding:0.5rem 1.2rem; border-radius:100px; font-family:'Heebo',sans-serif; font-size:0.8rem; cursor:pointer; transition:all 0.2s; margin-top:0.5rem; }
    .retry-btn:hover { border-color:var(--accent); color:var(--accent); }

    .no-highlight-msg { padding:2.5rem; text-align:center; color:var(--muted); font-size:0.95rem; line-height:1.8; }
    .loading { text-align:center; padding:3rem; color:var(--muted); font-size:0.9rem; letter-spacing:2px; }
    .loading::after { content:''; animation:dots 1.5s infinite; }
    @keyframes dots { 0%{content:''} 33%{content:'.'} 66%{content:'..'} 100%{content:'...'} }
    .error { background:rgba(255,71,87,0.1); border:1px solid var(--danger); border-radius:10px; padding:1rem 1.5rem; color:var(--danger); font-size:0.9rem; margin:1rem 0; }
    .empty { text-align:center; padding:4rem; color:var(--muted); }

    @media (max-width:600px) {
      header,main,.league-tabs,.matchday-nav { padding-right:1rem; padding-left:1rem; }
      .team-name { font-size:0.82rem; }
      .venue,.highlight-badge,.live-badge { display:none; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">SPOILERFREE<span>לוח משחקים ותקצירים</span></div>
  </div>
</header>

<div class="league-tabs">
  <button class="tab active" data-league="premier">🏴󠁧󠁢󠁥󠁮󠁧󠁿 פרמייר ליג</button>
  <button class="tab" data-league="israel">🇮🇱 ליגת העל</button>
  <button class="tab" data-league="bundesliga">🇩🇪 בונדסליגה</button>
  <button class="tab" data-league="laliga">🇪🇸 לה ליגה</button>
  <button class="tab" data-league="seriea">🇮🇹 סריה A</button>
  <button class="tab" data-league="ligue1">🇫🇷 ליג 1</button>
  <button class="tab" data-league="ucl">⭐ צ'מפיונס ליג</button>
  <button class="tab" data-league="argentina">🇦🇷 ארגנטינה</button>
  <button class="tab" data-league="__byday" style="margin-right:auto; border-style:dashed">📅 לפי יום</button>
</div>

<div class="matchday-nav hidden" id="matchday-nav">
  <button class="md-btn" id="md-prev">→</button>
  <div class="md-label" id="md-label">מחזור 1</div>
  <button class="md-btn" id="md-next">←</button>
  <select class="md-select" id="md-select"></select>
</div>

<div class="matchday-nav hidden" id="day-nav">
  <button class="md-btn" id="day-prev">→</button>
  <div class="md-label" id="day-label" style="min-width:160px"></div>
  <button class="md-btn" id="day-next">←</button>
  <button class="md-btn" id="day-today">חזרה להיום</button>
</div>

<main>
  <div class="status-bar">
    <div class="match-count" id="match-count"></div>
    <div class="sync-note" id="sync-note"></div>
    <button class="refresh-btn" id="refresh-btn">↻ רענן מ-API</button>
  </div>
  <div id="matches-container"><div class="loading">טוען משחקים</div></div>
</main>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
  // אותו origin — עובד גם מקומית (localhost:8000/app) וגם ב-Render
  const API = '';

  // קונפיג לרענון client-side (TheSportsDB חסום מ-Render — הדפדפן שולף)
  // חייב להיות תואם ל-LEAGUES ב-main.py
  const SPORTSDB_LEAGUES = {
    israel:     { ids: ['4644'], season: '2026-2027' },
    bundesliga: { ids: ['4331'], season: '2026-2027' },
    laliga:     { ids: ['4335'], season: '2026-2027' },
    seriea:     { ids: ['4332'], season: '2026-2027' },
    ligue1:     { ids: ['4334'], season: '2026-2027' },
    ucl:        { ids: ['4480'], season: '2026-2027' },
    argentina:  { ids: ['4406'], season: '2026' },
  };

  let currentLeague   = 'premier';
  let currentMatchday = null;
  let matchdayList    = [];   // המחזורים שקיימים בפועל בנתונים, ממוינים
  // ליגות שכבר רועננו אוטומטית בביקור הזה — מונע רענון חוזר בכל מעבר טאב
  const autoRefreshed = new Set();

  // ── Utils ──────────────────────────────────────────

  function todayStr() {
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    return `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`;
  }

  function isToday(dateStr) {
    return dateStr === todayStr();
  }

  function isYesterday(dateStr) {
    const y = new Date();
    y.setDate(y.getDate() - 1);
    const pad = n => String(n).padStart(2,'0');
    return dateStr === `${pad(y.getDate())}/${pad(y.getMonth()+1)}/${y.getFullYear()}`;
  }

  function parseDateStr(dateStr) {
    const [d, mo, y] = dateStr.split('/');
    return new Date(`${y}-${mo}-${d}`);
  }

  function groupByDate(matches) {
    const groups = {};
    for (const m of matches) {
      if (!groups[m.date]) groups[m.date] = [];
      groups[m.date].push(m);
    }
    return groups;
  }

  async function apiFetch(url, opts) {
    const r = await fetch(url, opts);
    // fresh=1 עוקף את קאש ה-service worker — אחרת היה מוגש שוב הדף השמור
    if (r.status === 401) { location.href = '/app?fresh=1'; throw new Error('auth'); }
    return r;
  }

  // ── Matchday nav ───────────────────────────────────

  function buildMatchdaySelect() {
    const sel = document.getElementById('md-select');
    sel.innerHTML = '';
    for (const md of matchdayList) {
      const opt = document.createElement('option');
      opt.value = md;
      opt.textContent = `מחזור ${md}`;
      sel.appendChild(opt);
    }
    sel.value = currentMatchday;
  }

  function updateMatchdayUI() {
    const idx = matchdayList.indexOf(currentMatchday);
    document.getElementById('md-label').textContent = `מחזור ${currentMatchday}`;
    document.getElementById('md-select').value = currentMatchday;
    document.getElementById('md-prev').disabled = idx <= 0;
    document.getElementById('md-next').disabled = idx < 0 || idx >= matchdayList.length - 1;
  }

  function showMatchdayNav(show) {
    document.getElementById('matchday-nav').classList.toggle('hidden', !show);
  }

  // ── Render ─────────────────────────────────────────

  function matchCardHTML(m) {
    const isLive = m.status === 'LIVE';
    const badge = isLive
      ? '<span class="live-badge">🔴 LIVE</span>'
      : (m.is_over ? '<span class="highlight-badge">▶ תקציר</span>' : '');
    const timeClass = isLive ? 'live' : (m.is_over ? 'past' : '');
    const cardClass = isLive ? 'is-live' : (m.is_over ? 'is-over' : '');
    return `
      <div class="match-card ${cardClass}"
           data-id="${m.id}" data-home="${m.home}"
           data-away="${m.away}" data-is-over="${m.is_over}">
        <div class="team away"><div class="team-name">${m.away}</div></div>
        <div class="match-meta">
          <div class="match-time ${timeClass}">${isLive ? 'LIVE' : m.time}</div>
          <div class="match-vs">VS</div>
          <div class="venue">${m.venue||''}</div>
        </div>
        <div class="team home"><div class="team-name">${m.home}</div></div>
        ${badge}
      </div>`;
  }

  function bindMatchCards(container) {
    container.querySelectorAll('.match-card').forEach(card => {
      card.addEventListener('click', () => {
        openMatchModal(card.dataset.id, card.dataset.home,
                       card.dataset.away, card.dataset.isOver === 'true');
      });
    });
  }

  function renderMatches(matches, scroll = true) {
    const container = document.getElementById('matches-container');
    const countEl   = document.getElementById('match-count');

    if (!matches.length) {
      container.innerHTML = '<div class="empty">אין משחקים להצגה<br><small style="opacity:0.6">לחץ "רענן מ-API" כדי לטעון</small></div>';
      countEl.textContent = '';
      return;
    }

    countEl.textContent = `${matches.length} משחקים`;
    const groups = groupByDate(matches);
    let html = '';
    let todayGroupId = null;

    for (const [date, dayMatches] of Object.entries(groups)) {
      const today     = isToday(date);
      const yesterday = isYesterday(date);
      const weekday   = dayMatches[0].weekday;
      const groupId   = `date-${date.replace(/\//g,'-')}`;
      if (today) todayGroupId = groupId;

      html += `<div class="date-group" id="${groupId}">
        <div class="date-label">
          <span class="weekday">${weekday}</span>
          <span>${date}</span>
          ${today ? '<span class="is-today">היום</span>' : ''}
          ${yesterday ? '<span class="is-today" style="background:var(--muted)">אתמול</span>' : ''}
        </div>`;

      for (const m of dayMatches) {
        html += matchCardHTML(m);
      }
      html += '</div>';
    }

    container.innerHTML = html;

    // Scroll to today
    if (todayGroupId && scroll) {
      setTimeout(() => {
        const el = document.getElementById(todayGroupId);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 100);
    }

    bindMatchCards(container);
  }

  // ── Data: מציגים מיד (קאש מקומי), מרעננים ברקע ─────
  // הלוח כמעט קבוע — אין סיבה שהמסך יחכה לרשת. כל ליגה נשמרת
  // ב-localStorage ומוצגת מיידית; הרשת רק מעדכנת בשקט.

  const leagueData = {};   // league -> רשימת המשחקים המלאה

  function cacheGet(league) {
    try { return JSON.parse(localStorage.getItem('sf:m:' + league)); }
    catch (e) { return null; }
  }
  function cachePut(league, data) {
    try { localStorage.setItem('sf:m:' + league, JSON.stringify(data)); }
    catch (e) {}
  }
  function setSyncNote(text) {
    document.getElementById('sync-note').textContent = text || '';
  }

  // מציג ליגה מתוך הרשימה המלאה. background=true: עדכון שקט —
  // שומר על המחזור שנבחר ולא גולל.
  function showLeague(league, matches, background = false) {
    leagueData[league] = matches;
    if (league !== currentLeague) return;
    const withMd = matches.filter(m => m.matchday);

    // אין נתוני מחזור לליגה הזו — תצוגת תאריכים רגילה
    if (!withMd.length) {
      showMatchdayNav(false);
      renderMatches(matches, !background);
      return;
    }

    showMatchdayNav(true);
    matchdayList = [...new Set(withMd.map(m => parseInt(m.matchday)))]
                     .sort((a, b) => a - b);
    if (!(background && matchdayList.includes(currentMatchday))) {
      // "המחזור הרלוונטי": הראשון שיש בו משחק שטרם נגמר.
      // אם הכל נגמר (סוף עונה / נתונים ישנים) — המחזור האחרון.
      let chosen = matchdayList[matchdayList.length - 1];
      for (const md of matchdayList) {
        if (withMd.some(m => parseInt(m.matchday) === md && !m.is_over)) { chosen = md; break; }
      }
      currentMatchday = chosen;
    }
    buildMatchdaySelect();
    updateMatchdayUI();
    renderMatchday(!background);
  }

  function renderMatchday(scroll = true) {
    const ms = (leagueData[currentLeague] || [])
      .filter(m => parseInt(m.matchday) === currentMatchday);
    renderMatches(ms, scroll);
  }

  async function openLeague(league) {
    setSyncNote('');
    updateRefreshBtn();
    const cached = cacheGet(league);
    if (cached && cached.matches) showLeague(league, cached.matches);
    else document.getElementById('matches-container').innerHTML = '<div class="loading">טוען משחקים</div>';

    let data;
    try {
      data = await apiFetch(`${API}/matches/${league}`).then(r => r.json());
    } catch (err) {
      if (err.message === 'auth' || league !== currentLeague) return;
      if (cached) setSyncNote('⚠ אין חיבור לשרת — מוצגים נתונים שמורים');
      else document.getElementById('matches-container').innerHTML =
        `<div class="error">שגיאה: ${err.message}<br><small>אם אתה מריץ מקומית — וודא שהבקנד רץ (localhost:8000/app)</small></div>`;
      return;
    }
    cachePut(league, data);
    showLeague(league, data.matches, !!cached);

    // נתונים מיושנים (3+ שעות) או ריקים — רענון ברקע, פעם אחת לליגה לביקור.
    // המסך כבר מציג את מה שיש; הרענון רק מעדכן בשקט כשהוא מסתיים.
    if ((data.stale || !data.matches.length) && !autoRefreshed.has(league)) {
      autoRefreshed.add(league);
      refreshLeague(league);
    }
  }

  // ── רענון (ברקע — המסך לא נחסם) ─────────────────────

  const refreshing = new Set();

  function updateRefreshBtn() {
    const btn = document.getElementById('refresh-btn');
    const busy = refreshing.has(currentLeague);
    btn.disabled = busy;
    btn.textContent = busy ? '⏳ מתעדכן...' : '↻ רענן מ-API';
  }

  async function refreshLeague(league) {
    if (refreshing.has(league)) return;
    refreshing.add(league);
    updateRefreshBtn();
    if (league === currentLeague) setSyncNote('⏳ מתעדכן ברקע...');
    let note = '';
    try {
      let data;
      if (SPORTSDB_LEAGUES[league]) {
        // sportsdb חסום מ-Render — הדפדפן שולף ושולח לשרת
        const res = await clientRefreshSportsdb(league);
        note = res.fresh ? `רענון — ${res.diag}` : 'הרענון לא החזיר נתונים עדכניים — נסה שוב';
        data = await apiFetch(`${API}/matches/${league}`).then(r => r.json());
      } else {
        // football-data — שליפה מצד השרת (לא חסום); התשובה כבר מכילה הכל
        data = await apiFetch(`${API}/matches/${league}?refresh=true`).then(r => r.json());
      }
      cachePut(league, data);
      showLeague(league, data.matches, true);
    } catch (e) {
      note = e.message === 'auth' ? '' : '⚠ הרענון נכשל — מוצגים הנתונים הקיימים';
    } finally {
      refreshing.delete(league);
      updateRefreshBtn();
    }
    if (league === currentLeague) setSyncNote(note);
  }

  function doRefresh() {
    refreshLeague(currentLeague);
  }

  // ── Client-side refresh (TheSportsDB חסום מ-Render) ─

  async function clientRefreshSportsdb(league) {
    const cfg = SPORTSDB_LEAGUES[league];
    // מפתח "123" מחזיר יותר נתונים מ-"3" (15 מול 5 ב-eventsseason)
    const BASE = 'https://www.thesportsdb.com/api/v1/json/123/';
    const events = [];
    const counts = { 'אחרונים': 0, 'הבאים': 0, 'מחזורים': 0 };

    async function grab(ep, label) {
      try {
        const r = await fetch(BASE + ep);
        const j = await r.json();
        const ev = (j && j.events) || [];
        events.push(...ev);
        counts[label] += ev.length;
        return ev;
      } catch (e) { return []; }
    }

    // הבקשות רצות במקביל (היה טור של ~7 בקשות רצופות)
    await Promise.all(cfg.ids.map(async id => {
      // 1. אחרונים — גם נתונים וגם זיהוי המחזור הנוכחי; 2. הבאים
      const [past] = await Promise.all([
        grab(`eventspastleague.php?id=${id}`, 'אחרונים'),
        grab(`eventsnextleague.php?id=${id}`, 'הבאים'),
      ]);
      // 3. חלון מחזורים: eventsround עוקף את תקרת eventsseason —
      //    מחזור שלם (~10 משחקים) נכנס מתחת לתקרה
      let maxRound = 0;
      for (const e of past) {
        const r = parseInt(e.intRound || 0);
        if (r > maxRound) maxRound = r;
      }
      const rounds = [];
      for (let r = Math.max(1, maxRound - 1); r <= maxRound + 3; r++) rounds.push(r);
      await Promise.all(rounds.map(r =>
        grab(`eventsround.php?id=${id}&r=${r}&s=${cfg.season}`, 'מחזורים')));
    }));

    // סינון משחקים ישנים מ-14 יום — מנקה שאריות מסבבים קודמים
    // (בארגנטינה מחזור N קיים גם ב-Apertura מינואר וגם ב-Clausura הנוכחי)
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 14);
    const fresh = events.filter(e => e.dateEvent && new Date(e.dateEvent) >= cutoff);

    if (fresh.length) {
      await apiFetch(`${API}/refresh/${league}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ events: fresh, purge: true }),
      });
    }
    // דיאגנוסטיקה: כמה החזיר כל endpoint של TheSportsDB
    const diag = Object.entries(counts).map(([k, v]) => `${k}: ${v}`).join(' · ');
    return { fresh: fresh.length, diag };
  }

  // ── Modal ──────────────────────────────────────────

  function openMatchModal(matchId, home, away, isOver) {
    const modal = document.getElementById('modal');
    const title = document.getElementById('modal-title');
    const body  = document.getElementById('modal-body');

    title.textContent = `${home} נגד ${away}`;

    // תמיד פונים לשרת — גם אם הרשימה חושבת שהמשחק לא נגמר.
    // הסטטוס ברשימה עלול להיות מיושן; השרת יודע לרענן אוטומטית
    // (football-data) או להחזיר הודעה מדויקת עם הנחיה.
    body.innerHTML = '<div class="loading">מחפש תקצירים</div>';
    modal.classList.add('open');

    apiFetch(`${API}/highlights/${matchId}`)
      .then(r => r.json())
      .then(data => {
        if (!data.available) {
          body.innerHTML = `<div class="no-highlight-msg">⏳ ${data.reason}</div>`;
          return;
        }

        const allBtns = [];
        let hasChannel = false;
        for (const source of data.sources) {
          if (source.status !== 'no_channel') hasChannel = true;
          if (!source.videos || !source.videos.length) continue;
          for (const v of source.videos) {
            // תמיד מציגים את סוג התקציר — שקיפות מלאה על מה לוחצים
            const label = `${source.name} — ${v.label}`;
            if (source.allow_embed) {
              allBtns.push(
                `<button class="play-btn ${v.extended ? 'extended' : ''}"
                         onclick="loadVideo('${v.video_id}')">▶ ${label}</button>`);
            } else {
              // embed חסום — פותחים ביוטיוב בטאב חדש
              allBtns.push(
                `<button class="play-btn ${v.extended ? 'extended' : ''}"
                         onclick="openOnYoutube('${v.video_id}')">▶ ${label} ↗</button>`);
            }
          }
        }

        // כפתורי אתר (ספורט1/וואלה/ספורט5) — קפיצה לתוצאה ראשונה
        const webBtns = (data.web_links || []).map(l =>
          `<button class="retry-btn" onclick="window.open('${l.url}','_blank')">🔗 ${l.name} ↗</button>`);
        const webRow = webBtns.length
          ? `<div class="sources-row">${webBtns.join('')}</div>
             <div class="shield-note">🔗 קישורי אתר — קופץ לתוצאה הראשונה; ייתכן ספוילר בכותרת עמוד היעד</div>`
          : '';

        if (!hasChannel && !webBtns.length) {
          body.innerHTML = `
            <div class="no-highlight-msg">
              🎬 מקור תקצירים לליגה זו עדיין לא הוגדר
              <br><small style="opacity:0.5">בקרוב — צריך למצוא את הערוץ הרשמי ביוטיוב</small>
            </div>`;
          return;
        }

        if (!allBtns.length) {
          body.innerHTML = `
            <div class="video-container">
              <div class="spoiler-shield">
                <div class="shield-icon">🔍</div>
                <div class="shield-text">התקציר עדיין לא הועלה ליוטיוב</div>
                ${webRow}
                <button class="retry-btn" onclick="retryHighlights('${matchId}', '${home}', '${away}')">↻ נסה שוב</button>
              </div>
            </div>`;
          return;
        }

        body.innerHTML = `
          <div class="video-container">
            <div class="spoiler-shield" id="shield">
              <div class="shield-icon">🛡️</div>
              <div class="shield-text">בחר גרסה לצפייה</div>
              <div class="sources-row">${allBtns.join('')}</div>
              <div class="shield-note">↗ = נפתח ביוטיוב בטאב חדש</div>
              ${webRow}
              <button class="retry-btn" style="opacity:0.6"
                      onclick="retryHighlights('${matchId}', '${home}', '${away}')">↻ חפש שוב (מנקה קאש)</button>
            </div>
            <div id="video-frame"></div>
          </div>`;
      })
      .catch(err => {
        if (err.message === 'auth') return;
        body.innerHTML = `<div class="no-highlight-msg">שגיאה בחיפוש תקציר</div>`;
      });
  }

  async function retryHighlights(matchId, home, away) {
    try {
      await apiFetch(`${API}/cache/${matchId}`, { method: 'DELETE' });
    } catch(e) {}
    openMatchModal(matchId, home, away, true);
  }

  function openOnYoutube(videoId) {
    window.open(`https://www.youtube.com/watch?v=${videoId}`, '_blank');
  }

  function loadVideo(videoId) {
    document.getElementById('shield').style.display = 'none';
    document.getElementById('video-frame').innerHTML = `
      <iframe
        src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
        allowfullscreen></iframe>`;
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
    const f = document.getElementById('video-frame');
    if (f) f.innerHTML = '';
  }

  // ── תצוגת "לפי יום" ─────────────────────────────────

  let currentDay = new Date();
  const HEB_DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];

  function isoDay(d) {
    const pad = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }

  function enterDayView() {
    showMatchdayNav(false);
    document.getElementById('day-nav').classList.remove('hidden');
    document.getElementById('refresh-btn').style.display = 'none';
    setSyncNote('');
    currentDay = new Date();
    loadDay();
  }

  function exitDayView() {
    document.getElementById('day-nav').classList.add('hidden');
    document.getElementById('refresh-btn').style.display = '';
  }

  function updateDayUI() {
    const iso = isoDay(currentDay), todayIso = isoDay(new Date());
    const [y, mo, d] = iso.split('-');
    let label = `${HEB_DAYS[currentDay.getDay()]} · ${d}/${mo}`;
    if (iso === todayIso) label += ' (היום)';
    document.getElementById('day-label').textContent = label;
    document.getElementById('day-today').disabled = iso === todayIso;
  }

  async function loadDay() {
    updateDayUI();
    const container = document.getElementById('matches-container');
    container.innerHTML = '<div class="loading">טוען משחקים</div>';
    try {
      const data = await apiFetch(`${API}/matches/by_date/${isoDay(currentDay)}`)
                     .then(r => r.json());
      renderDayMatches(data.matches);
    } catch (err) {
      if (err.message === 'auth') return;
      container.innerHTML = `<div class="error">שגיאה: ${err.message}</div>`;
    }
  }

  function renderDayMatches(matches) {
    const container = document.getElementById('matches-container');
    const countEl   = document.getElementById('match-count');
    if (!matches.length) {
      container.innerHTML = '<div class="empty">אין משחקים בתאריך זה<br>' +
        '<small style="opacity:0.6">מהליגות שנאספות — ליגה מתעדכנת דרך הטאב שלה</small></div>';
      countEl.textContent = '';
      return;
    }
    countEl.textContent = `${matches.length} משחקים`;
    // השרת כבר מיין: סדר ליגות ואז שעה — נשאר רק לקבץ לכותרות
    let html = '', lastLeague = null;
    for (const m of matches) {
      if (m.league !== lastLeague) {
        if (lastLeague !== null) html += '</div>';
        html += `<div class="date-group">
          <div class="date-label"><span class="weekday">${m.league}</span></div>`;
        lastLeague = m.league;
      }
      html += matchCardHTML(m);
    }
    html += '</div>';
    container.innerHTML = html;
    bindMatchCards(container);
  }

  // ── Events ─────────────────────────────────────────

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentLeague = tab.dataset.league;
      if (currentLeague === '__byday') { enterDayView(); }
      else { exitDayView(); openLeague(currentLeague); }
    });
  });

  document.getElementById('md-prev').addEventListener('click', () => {
    const idx = matchdayList.indexOf(currentMatchday);
    if (idx > 0) { currentMatchday = matchdayList[idx-1]; updateMatchdayUI(); renderMatchday(); }
  });
  document.getElementById('md-next').addEventListener('click', () => {
    const idx = matchdayList.indexOf(currentMatchday);
    if (idx >= 0 && idx < matchdayList.length-1) { currentMatchday = matchdayList[idx+1]; updateMatchdayUI(); renderMatchday(); }
  });
  document.getElementById('md-select').addEventListener('change', e => {
    currentMatchday = parseInt(e.target.value); updateMatchdayUI(); renderMatchday();
  });

  document.getElementById('day-prev').addEventListener('click', () => {
    currentDay.setDate(currentDay.getDate() - 1); loadDay();
  });
  document.getElementById('day-next').addEventListener('click', () => {
    currentDay.setDate(currentDay.getDate() + 1); loadDay();
  });
  document.getElementById('day-today').addEventListener('click', () => {
    currentDay = new Date(); loadDay();
  });

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal').addEventListener('click', e => { if (e.target===e.currentTarget) closeModal(); });
  document.getElementById('refresh-btn').addEventListener('click', doRefresh);
  document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });

  // ── Init ───────────────────────────────────────────
  openLeague(currentLeague);

  // PWA: הדף נשמר במכשיר ונפתח מיד גם כשהשרת ישן
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
</script>
