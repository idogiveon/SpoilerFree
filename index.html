<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpoilerFree ⚽</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SpoilerFree">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f; --surface: #13131a; --card: #1a1a24; --card-hover: #21212e;
      --border: #2a2a3a; --accent: #00e5a0; --text: #e8e8f0; --muted: #6b6b80; --danger: #ff4757;
      --live: #ff6b6b;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    /* hidden גובר על display:flex של חלונות (אחרת החלון נפתח בטעינה) */
    [hidden] { display:none !important; }
    body { background:var(--bg); color:var(--text); font-family:'Heebo',sans-serif; min-height:100vh; overflow-x:hidden; }
    body::before { content:''; position:fixed; top:-50%; right:-20%; width:600px; height:600px; background:radial-gradient(circle,rgba(0,229,160,0.04) 0%,transparent 70%); pointer-events:none; z-index:0; }

    header { padding:1.5rem 2rem 1rem; border-bottom:1px solid var(--border); position:relative; z-index:1; }
    .header-inner { max-width:960px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
    .logo { font-family:'Bebas Neue',sans-serif; font-size:2rem; letter-spacing:2px; color:var(--accent); line-height:1; }
    .logo span { color:var(--muted); font-size:0.8rem; font-family:'Heebo',sans-serif; font-weight:300; display:block; letter-spacing:4px; text-transform:uppercase; margin-top:2px; }

    .user-bar { font-size:0.75rem; color:var(--muted); display:flex; gap:0.8rem; align-items:center; flex-wrap:wrap; }
    .user-bar a, .user-bar button { color:var(--muted); background:none; border:none; font:inherit; cursor:pointer; text-decoration:underline; padding:0; }
    .user-bar a:hover, .user-bar button:hover { color:var(--accent); }

    .app-footer { max-width:960px; margin:0 auto; padding:0 2rem 2rem; text-align:center; position:relative; z-index:1; }
    .cookie-link { background:none; border:none; color:#4a4a5a; font-family:'Heebo',sans-serif; font-size:0.7rem; text-decoration:underline; cursor:pointer; }
    .sheet-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1100; display:flex; align-items:center; justify-content:center; padding:1rem; }
    .sheet { background:var(--surface); border:1px solid var(--border); border-radius:12px; max-width:460px; width:100%; max-height:80vh; overflow:auto; padding:1.5rem; }
    .sheet h2 { font-size:1rem; margin-bottom:0.8rem; }
    .sheet h3 { font-size:0.8rem; color:#9a9ab0; margin:1rem 0 0.3rem; }
    .sheet p { font-size:0.8rem; color:var(--muted); line-height:1.6; }
    .sheet p b { color:var(--text); }
    .sheet input { width:100%; padding:0.6rem; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text); margin:0.6rem 0; }
    .sheet-close { margin-top:1.2rem; width:100%; padding:0.6rem; border-radius:100px; border:none; background:var(--accent); color:#000; font-weight:700; cursor:pointer; font-family:'Heebo',sans-serif; }
    .danger-zone { margin-top:1.2rem; border-top:1px solid var(--border); padding-top:0.8rem; }
    .danger-zone summary { font-size:0.75rem; color:var(--muted); cursor:pointer; }
    .danger-btn { width:100%; padding:0.6rem; border-radius:8px; border:1px solid var(--danger); background:transparent; color:var(--danger); cursor:pointer; font-family:'Heebo',sans-serif; }
    .del-err { color:var(--danger); font-size:0.75rem; min-height:1em; margin-top:0.4rem; }

    .league-tabs { display:flex; gap:0.5rem; flex-wrap:wrap; padding:1rem 2rem; max-width:960px; margin:0 auto; position:relative; z-index:1; }
    .tab { padding:0.4rem 1rem; border-radius:100px; border:1px solid var(--border); background:transparent; color:var(--muted); font-family:'Heebo',sans-serif; font-size:0.85rem; cursor:pointer; transition:all 0.2s; white-space:nowrap; }
    .tab:hover { border-color:var(--accent); color:var(--accent); }
    .tab.active { background:var(--accent); border-color:var(--accent); color:#000; font-weight:700; }

    .matchday-nav { max-width:960px; margin:0 auto; padding:0 2rem 1rem; display:flex; align-items:center; gap:0.75rem; position:relative; z-index:1; }
    .matchday-nav.hidden { display:none; }
    .md-btn { background:transparent; border:1px solid var(--border); color:var(--muted); font-family:'Heebo',sans-serif; font-size:0.85rem; padding:0.4rem 0.9rem; border-radius:8px; cursor:pointer; transition:all 0.2s; }
    .md-btn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
    .md-btn:disabled { opacity:0.3; cursor:default; }
    .md-label { font-family:'Bebas Neue',sans-serif; font-size:1.1rem; color:var(--text); letter-spacing:1px; min-width:90px; text-align:center; }
    .md-select { background:var(--surface); border:1px solid var(--border); color:var(--text); font-family:'Heebo',sans-serif; font-size:0.85rem; padding:0.35rem 0.7rem; border-radius:8px; cursor:pointer; outline:none; }

    main { max-width:960px; margin:0 auto; padding:0 2rem 4rem; position:relative; z-index:1; }
    .status-bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.25rem; flex-wrap:wrap; gap:0.5rem; }
    .match-count { font-size:0.8rem; color:var(--muted); letter-spacing:1px; text-transform:uppercase; }
    .refresh-btn { background:transparent; border:1px solid var(--border); color:var(--muted); font-family:'Heebo',sans-serif; font-size:0.8rem; padding:0.3rem 0.8rem; border-radius:6px; cursor:pointer; transition:all 0.2s; }
    .refresh-btn:hover { border-color:var(--accent); color:var(--accent); }
    .refresh-btn:disabled { opacity:0.4; cursor:default; }
    .sync-note { font-size:0.72rem; color:var(--muted); margin-inline-start:auto; margin-inline-end:0.75rem; }

    .date-group { margin-bottom:1.75rem; }
    .date-label { font-size:0.75rem; color:var(--muted); letter-spacing:3px; text-transform:uppercase; padding:0.4rem 0; margin-bottom:0.6rem; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:0.75rem; }
    .date-label .weekday { color:var(--accent); font-weight:700; }
    .date-label .is-today { background:var(--accent); color:#000; font-size:0.65rem; padding:0.1rem 0.5rem; border-radius:100px; font-weight:900; }

    .match-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:0.9rem 1.25rem; margin-bottom:0.5rem; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:1rem; cursor:pointer; transition:all 0.2s; position:relative; overflow:hidden; }
    .match-card::before { content:''; position:absolute; inset-inline-start:0; top:0; bottom:0; width:3px; background:var(--border); transition:background 0.2s; }
    .match-card:hover { background:var(--card-hover); border-color:rgba(0,229,160,0.3); transform:translateX(-2px); }
    .match-card:hover::before { background:var(--accent); }
    .match-card.is-over { border-color:rgba(0,229,160,0.12); }
    .match-card.is-live { border-color:rgba(255,107,107,0.4); }
    .match-card.is-live::before { background:var(--live); }
    .highlight-badge { position:absolute; inset-inline-end:1rem; top:50%; transform:translateY(-50%); font-size:0.68rem; color:var(--accent); letter-spacing:1px; background:rgba(0,229,160,0.08); padding:0.2rem 0.6rem; border-radius:100px; border:1px solid rgba(0,229,160,0.25); }
    .live-badge { position:absolute; inset-inline-end:1rem; top:50%; transform:translateY(-50%); font-size:0.68rem; color:var(--live); letter-spacing:1px; background:rgba(255,107,107,0.08); padding:0.2rem 0.6rem; border-radius:100px; border:1px solid rgba(255,107,107,0.25); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

    .team { display:flex; flex-direction:column; gap:0.1rem; }
    /* הבית ראשון בכיוון הקריאה; הטקסט מיושר כלפי המרכז — עובד גם RTL וגם LTR */
    .team.home { text-align:end; }
    .team.away { text-align:start; }
    .fav-row { display:flex; gap:0.4rem; margin-top:0.4rem; flex-wrap:wrap; }
    .fav-btn { background:transparent; border:1px solid var(--border); color:var(--muted); border-radius:100px; padding:0.15rem 0.6rem; font-size:0.72rem; cursor:pointer; font-family:'Heebo',sans-serif; }
    .fav-btn:hover { border-color:#ffc107; color:#ffc107; }
    .fav-group .date-label .weekday { color:#ffc107; }
    .header-tools { display:flex; align-items:center; gap:0.8rem; flex-wrap:wrap; }
    .lang-select { background:var(--surface); border:1px solid var(--border); color:var(--muted); font-family:'Heebo',sans-serif; font-size:0.75rem; padding:0.2rem 0.4rem; border-radius:6px; cursor:pointer; }
    .team-name { font-size:0.95rem; font-weight:700; line-height:1.2; }
    .match-meta { text-align:center; display:flex; flex-direction:column; align-items:center; gap:0.25rem; min-width:65px; }
    .match-time { font-family:'Bebas Neue',sans-serif; font-size:1.2rem; color:var(--accent); letter-spacing:1px; line-height:1; }
    .match-time.past { color:var(--muted); }
    .match-time.live { color:var(--live); }
    .match-vs { font-size:0.6rem; color:var(--muted); letter-spacing:2px; }
    .venue { font-size:0.65rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:110px; }

    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:1000; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.3s; }
    .modal-overlay.open { opacity:1; pointer-events:all; }
    .modal { width:90vw; max-width:900px; background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; transform:translateY(20px); transition:transform 0.3s; }
    .modal-overlay.open .modal { transform:translateY(0); }
    .modal-header { padding:1rem 1.25rem; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); }
    .modal-title { font-size:1rem; font-weight:700; }
    .modal-close { background:transparent; border:none; color:var(--muted); font-size:1.4rem; cursor:pointer; line-height:1; padding:0.2rem 0.5rem; border-radius:6px; transition:all 0.2s; }
    .modal-close:hover { color:var(--text); background:var(--border); }

    .video-container { position:relative; padding-bottom:56.25%; height:0; background:#000; }
    .video-container iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:none; }

    .spoiler-shield { position:absolute; inset:0; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1rem; z-index:10; padding:2rem; }
    .shield-icon { font-size:3rem; }
    .shield-text { font-size:1rem; color:var(--muted); text-align:center; }
    .shield-note { font-size:0.75rem; color:var(--muted); opacity:0.7; }
    .sources-row { display:flex; gap:0.75rem; flex-wrap:wrap; justify-content:center; margin-top:0.5rem; }

    .play-btn { background:var(--accent); color:#000; border:none; padding:0.7rem 1.5rem; border-radius:100px; font-family:'Heebo',sans-serif; font-size:0.9rem; font-weight:700; cursor:pointer; transition:all 0.2s; white-space:nowrap; }
    .play-btn:hover { transform:scale(1.05); }
    .play-btn.extended { background:transparent; border:2px solid var(--accent); color:var(--accent); }
    .play-btn.extended:hover { background:rgba(0,229,160,0.1); }

    .retry-btn { background:transparent; border:1px solid var(--border); color:var(--muted); padding:0.5rem 1.2rem; border-radius:100px; font-family:'Heebo',sans-serif; font-size:0.8rem; cursor:pointer; transition:all 0.2s; margin-top:0.5rem; }
    .retry-btn:hover { border-color:var(--accent); color:var(--accent); }

    .no-highlight-msg { padding:2.5rem; text-align:center; color:var(--muted); font-size:0.95rem; line-height:1.8; }
    .loading { text-align:center; padding:3rem; color:var(--muted); font-size:0.9rem; letter-spacing:2px; }
    .loading::after { content:''; animation:dots 1.5s infinite; }
    @keyframes dots { 0%{content:''} 33%{content:'.'} 66%{content:'..'} 100%{content:'...'} }
    .error { background:rgba(255,71,87,0.1); border:1px solid var(--danger); border-radius:10px; padding:1rem 1.5rem; color:var(--danger); font-size:0.9rem; margin:1rem 0; }
    .empty { text-align:center; padding:4rem; color:var(--muted); }

    @media (max-width:600px) {
      header,main,.league-tabs,.matchday-nav { padding-right:1rem; padding-left:1rem; }
      .team-name { font-size:0.82rem; }
      .venue,.highlight-badge,.live-badge { display:none; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">SPOILERFREE<span data-i18n="tagline">לוח משחקים ותקצירים</span></div>
    <div class="header-tools">
      <select class="lang-select" id="lang-select" aria-label="Language">
        <option value="he">🌐 עברית</option>
        <option value="en">🌐 English</option>
        <option value="es">🌐 Español</option>
        <option value="fr">🌐 Français</option>
      </select>
      <div class="user-bar" id="user-bar"></div>
    </div>
  </div>
</header>

<div class="league-tabs">
  <button class="tab" data-league="premier" data-i18n="lg_premier" data-prefix="🏴󠁧󠁢󠁥󠁮󠁧󠁿 ">🏴󠁧󠁢󠁥󠁮󠁧󠁿 פרמייר ליג</button>
  <button class="tab" data-league="championship" data-i18n="lg_championship" data-prefix="🏴󠁧󠁢󠁥󠁮󠁧󠁿 ">🏴󠁧󠁢󠁥󠁮󠁧󠁿 צ'מפיונשיפ</button>
  <button class="tab" data-league="israel" data-i18n="lg_israel" data-prefix="🇮🇱 ">🇮🇱 ליגת העל</button>
  <button class="tab" data-league="bundesliga" data-i18n="lg_bundesliga" data-prefix="🇩🇪 ">🇩🇪 בונדסליגה</button>
  <button class="tab" data-league="laliga" data-i18n="lg_laliga" data-prefix="🇪🇸 ">🇪🇸 לה ליגה</button>
  <button class="tab" data-league="seriea" data-i18n="lg_seriea" data-prefix="🇮🇹 ">🇮🇹 סריה A</button>
  <button class="tab" data-league="ligue1" data-i18n="lg_ligue1" data-prefix="🇫🇷 ">🇫🇷 ליג 1</button>
  <button class="tab" data-league="ucl" data-i18n="lg_ucl" data-prefix="⭐ ">⭐ צ'מפיונס ליג</button>
  <button class="tab" data-league="mls" data-i18n="lg_mls" data-prefix="🇺🇸 ">🇺🇸 MLS</button>
  <button class="tab" data-league="argentina" data-i18n="lg_argentina" data-prefix="🇦🇷 ">🇦🇷 ארגנטינה</button>
  <button class="tab active" data-league="__byday" data-i18n="byday" data-prefix="📅 " style="margin-inline-start:auto; border-style:dashed">📅 לפי יום</button>
</div>

<div class="matchday-nav hidden" id="matchday-nav">
  <button class="md-btn" id="md-prev" data-i18n="arrow_prev">→</button>
  <div class="md-label" id="md-label">מחזור 1</div>
  <button class="md-btn" id="md-next" data-i18n="arrow_next">←</button>
  <select class="md-select" id="md-select"></select>
</div>

<div class="matchday-nav hidden" id="day-nav">
  <button class="md-btn" id="day-prev" data-i18n="arrow_prev">→</button>
  <div class="md-label" id="day-label" style="min-width:160px"></div>
  <button class="md-btn" id="day-next" data-i18n="arrow_next">←</button>
  <button class="md-btn" id="day-today" data-i18n="back_today">חזרה להיום</button>
</div>

<main>
  <div class="status-bar">
    <div class="match-count" id="match-count"></div>
    <div class="sync-note" id="sync-note"></div>
    <button class="refresh-btn" id="refresh-btn">↻ רענן מ-API</button>
  </div>
  <div id="matches-container"><div class="loading">טוען משחקים</div></div>
</main>

<footer class="app-footer">
  <button class="cookie-link" id="cookie-link">Cookie settings</button>
</footer>

<div class="sheet-overlay" id="sheet" hidden>
  <div class="sheet">
    <div id="sheet-body"></div>
    <button class="sheet-close" id="sheet-close" data-i18n="close">סגור</button>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modal-title"></div>
        <div class="fav-row" id="modal-favs"></div>
      </div>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
  // אותו origin — עובד גם מקומית (localhost:8000/app) וגם ב-Render
  const API = '';

  // ── שפה ────────────────────────────────────────────
  const I18N = JSON.parse(document.getElementById('i18n').textContent);
  const LOCALES = { he: 'he-IL', en: 'en-GB', es: 'es-ES', fr: 'fr-FR' };
  let LANG = 'he';
  try { LANG = localStorage.getItem('sf:lang') || 'he'; } catch (e) {}
  if (!I18N[LANG]) LANG = 'he';

  function t(key, vars = {}) {
    let s = (I18N[LANG] || {})[key] ?? I18N.he[key] ?? key;
    for (const [k, v] of Object.entries(vars)) s = s.replace(`{${k}}`, v);
    return s;
  }
  const dayName = d => (I18N[LANG].days || I18N.he.days)[d.getDay()];

  // טקסטים קבועים בדף (data-i18n) + כיוון הדף
  function applyStatic() {
    document.documentElement.lang = LANG;
    document.documentElement.dir = LANG === 'he' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = (el.dataset.prefix || '') + t(el.dataset.i18n);
    });
    document.getElementById('lang-select').value = LANG;
  }

  // השרת מחזיר את סוג התקציר בעברית — מתורגם כאן
  const HE_LABEL_KIND = { 'תקציר קצר': 'kind_short', 'תקציר מלא': 'kind_full',
                          'תקציר מורחב': 'kind_extended', 'תקציר': 'kind_regular' };
  const kindLabel = v => HE_LABEL_KIND[v.label] ? t(HE_LABEL_KIND[v.label]) : v.label;
  // שמות מקורות: אתרים ישראליים באנגלית, ערוץ מועדון — שם הקבוצה
  const SRC_NAMES = { 'ספורט 1': 'Sport 1', 'ספורט 5': 'Sport 5', 'וואלה': 'Walla' };
  function srcName(s) {
    if (s.club_name) return s.club_name;   // ערוץ מועדון — שם הקבוצה בשפה שנבחרה
    if (LANG === 'he') return s.name;
    return s.club_team || SRC_NAMES[s.name] || s.name;
  }

  // קונפיג לרענון client-side (TheSportsDB חסום מ-Render — הדפדפן שולף)
  // חייב להיות תואם ל-LEAGUES ב-main.py
  const SPORTSDB_LEAGUES = {
    championship: { ids: ['4329'], season: '2026-2027' },
    israel:     { ids: ['4644'], season: '2026-2027' },
    bundesliga: { ids: ['4331'], season: '2026-2027' },
    laliga:     { ids: ['4335'], season: '2026-2027' },
    seriea:     { ids: ['4332'], season: '2026-2027' },
    ligue1:     { ids: ['4334'], season: '2026-2027' },
    ucl:        { ids: ['4480'], season: '2026-2027' },
    mls:        { ids: ['4346'], season: '2026' },
    argentina:  { ids: ['4406'], season: '2026' },
  };

  let currentLeague   = '__byday';   // עמוד הפתיחה: "לפי יום"
  let currentMatchday = null;
  let matchdayList    = [];   // המחזורים שקיימים בפועל בנתונים, ממוינים
  // ליגות שכבר רועננו אוטומטית בביקור הזה — מונע רענון חוזר בכל מעבר טאב
  const autoRefreshed = new Set();

  // ── Utils ──────────────────────────────────────────

  function todayStr() {
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    return `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`;
  }

  function isToday(dateStr) {
    return dateStr === todayStr();
  }

  function isYesterday(dateStr) {
    const y = new Date();
    y.setDate(y.getDate() - 1);
    const pad = n => String(n).padStart(2,'0');
    return dateStr === `${pad(y.getDate())}/${pad(y.getMonth()+1)}/${y.getFullYear()}`;
  }

  function parseDateStr(dateStr) {
    const [d, mo, y] = dateStr.split('/');
    return new Date(`${y}-${mo}-${d}`);
  }

  function groupByDate(matches) {
    const groups = {};
    for (const m of matches) {
      if (!groups[m.date]) groups[m.date] = [];
      groups[m.date].push(m);
    }
    return groups;
  }

  async function apiFetch(url, opts) {
    const r = await fetch(url, opts);
    // fresh=1 עוקף את קאש ה-service worker — אחרת היה מוגש שוב הדף השמור
    if (r.status === 401) { location.href = '/?fresh=1'; throw new Error('auth'); }
    return r;
  }

  // ── משתמש + מעקב שימוש ─────────────────────────────

  // אירוע שימוש (נשמר למשתמש המחובר) — לא חוסם ולא מפיל כלום אם נכשל
  function track(type, data = {}) {
    try {
      fetch(`${API}/events`, {
        method: 'POST', keepalive: true,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type, ...data }),
      }).catch(() => {});
    } catch (e) {}
  }

  // ── מועדפים ────────────────────────────────────────
  // מפתח = ליגה + שם הקבוצה במקור. עם חשבון אישי — בשרת (כל המכשירים),
  // בלי (סיסמה ישנה / מקומי) — במכשיר.
  let ME = null;
  let FAVS = new Set();
  let favCtx = null;            // הקבוצות בחלון המשחק הפתוח
  let lastDayMatches = null;    // לתצוגה מחדש של "לפי יום" בלי טעינה
  const favKey = (lg, team) => `${lg}|${team}`;
  const isFav = (lg, team) => FAVS.has(favKey(lg, team));
  const matchLeague = m => m.league_key || currentLeague;
  const isFavMatch = m => isFav(matchLeague(m), m.home) || isFav(matchLeague(m), m.away);
  const serverFavs = () => !!(ME && ME.email);

  async function loadFavorites() {
    try {
      if (serverFavs()) {
        const r = await apiFetch(`${API}/favorites`).then(r => r.json());
        FAVS = new Set(r.favorites.map(([lg, team]) => favKey(lg, team)));
      } else {
        FAVS = new Set(JSON.parse(localStorage.getItem('sf:favs') || '[]'));
      }
    } catch (e) {}
  }

  async function toggleFav(lg, team) {
    const k = favKey(lg, team), on = !FAVS.has(k);
    if (on) FAVS.add(k); else FAVS.delete(k);
    renderFavRow();
    rerender();
    try {
      if (serverFavs()) {
        await apiFetch(`${API}/favorites`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ league_key: lg, team, on }),
        });
      } else {
        localStorage.setItem('sf:favs', JSON.stringify([...FAVS]));
      }
    } catch (e) {}
  }

  function rerender() {
    if (currentLeague === '__byday') { if (lastDayMatches) renderDayMatches(lastDayMatches); }
    else if (leagueData[currentLeague]) showLeague(currentLeague, leagueData[currentLeague], true);
  }

  // כפתורי ☆/⭐ לשתי הקבוצות בחלון המשחק
  function renderFavRow() {
    const el = document.getElementById('modal-favs');
    if (!favCtx) { el.innerHTML = ''; return; }
    const teams = [[favCtx.home, favCtx.homeName], [favCtx.away, favCtx.awayName]];
    el.innerHTML = teams.map(([key, name], i) =>
      `<button class="fav-btn" data-i="${i}" title="${t('fav_hint')}">${isFav(favCtx.league, key) ? '⭐' : '☆'} ${esc(name)}</button>`
    ).join('');
    el.querySelectorAll('.fav-btn').forEach(btn => btn.addEventListener('click', () => {
      toggleFav(favCtx.league, teams[+btn.dataset.i][0]);
    }));
  }

  function favGroupHTML(ms) {
    return `<div class="date-group fav-group">
      <div class="date-label"><span class="weekday">⭐ ${t('favorites')}</span></div>
      ${ms.map(matchCardHTML).join('')}</div>`;
  }

  async function loadUserBar() {
    try {
      const me = await apiFetch(`${API}/auth/me`).then(r => r.json());
      ME = me;
      if (!me.auth_on) return;
      const bar = document.getElementById('user-bar');
      const who = document.createElement('span');
      who.dir = 'ltr';
      who.textContent = me.email || t('password_login');
      bar.replaceChildren(who);
      if (me.email) bar.insertAdjacentHTML('beforeend', `<button onclick="openAccount()">${t('account')}</button>`);
      if (me.is_admin) bar.insertAdjacentHTML('beforeend', `<a href="/admin/users">${t('admin')}</a>`);
      bar.insertAdjacentHTML('beforeend', `<button onclick="logout()">${t('logout')}</button>`);
    } catch (e) {}
  }

  // ── חלון כללי: Cookie settings / חשבון ──────────────
  const esc = s => String(s ?? '').replace(/[&<>"']/g,
    c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));

  function openSheet(html) {
    document.getElementById('sheet-body').innerHTML = html;
    document.getElementById('sheet').hidden = false;
  }
  function closeSheet() { document.getElementById('sheet').hidden = true; }

  async function openCookies() {
    openSheet(`<div class="loading">${t('loading')}</div>`);
    try { openSheet(await (await fetch(`${API}/cookies?lang=${LANG}`)).text()); }
    catch (e) { closeSheet(); }
  }

  async function openAccount() {
    openSheet(`<div class="loading">${t('loading')}</div>`);
    try {
      const a = await apiFetch(`${API}/auth/account`).then(r => r.json());
      const d = iso => iso ? new Date(iso).toLocaleDateString(LOCALES[LANG]) : '—';
      openSheet(`<h2>${t('my_account')}</h2>
        <p>${t('email')}: <b dir="ltr">${esc(a.email)}</b></p>
        <p>${t('joined')}: ${d(a.created_at)} · ${t('last_login')}: ${d(a.last_login)} · ${t('logins')}: ${a.login_count || 0}</p>
        <details class="danger-zone"><summary>${t('delete_account')}</summary>
          <p>${t('delete_warning')}</p>
          <input id="del-confirm" dir="ltr" autocomplete="off" placeholder="${esc(a.email)}">
          <button class="danger-btn" onclick="deleteAccount()">${t('delete_btn')}</button>
          <div class="del-err" id="del-err"></div>
        </details>`);
    } catch (e) {
      if (e.message !== 'auth') openSheet(`<p>${t('account_error')}</p>`);
    }
  }

  async function deleteAccount() {
    const r = await fetch(`${API}/auth/delete_account`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ confirm: document.getElementById('del-confirm').value }),
    });
    if (r.ok) { location.href = '/?fresh=1'; return; }
    let j = {}; try { j = await r.json(); } catch (e) {}
    document.getElementById('del-err').textContent = j.detail || t('delete_failed');
  }

  async function logout() {
    try { await fetch(`${API}/auth/logout`, { method: 'POST' }); } catch (e) {}
    location.href = '/?fresh=1';
  }

  // ── Matchday nav ───────────────────────────────────

  function buildMatchdaySelect() {
    const sel = document.getElementById('md-select');
    sel.innerHTML = '';
    for (const md of matchdayList) {
      const opt = document.createElement('option');
      opt.value = md;
      opt.textContent = t('matchday', { n: md });
      sel.appendChild(opt);
    }
    sel.value = currentMatchday;
  }

  function updateMatchdayUI() {
    const idx = matchdayList.indexOf(currentMatchday);
    document.getElementById('md-label').textContent = t('matchday', { n: currentMatchday });
    document.getElementById('md-select').value = currentMatchday;
    document.getElementById('md-prev').disabled = idx <= 0;
    document.getElementById('md-next').disabled = idx < 0 || idx >= matchdayList.length - 1;
  }

  function showMatchdayNav(show) {
    document.getElementById('matchday-nav').classList.toggle('hidden', !show);
  }

  // ── Render ─────────────────────────────────────────

  function matchCardHTML(m) {
    const isLive = m.status === 'LIVE';
    const badge = isLive
      ? '<span class="live-badge">🔴 LIVE</span>'
      : (m.is_over ? `<span class="highlight-badge">${t('badge')}</span>` : '');
    const timeClass = isLive ? 'live' : (m.is_over ? 'past' : '');
    const cardClass = isLive ? 'is-live' : (m.is_over ? 'is-over' : '');
    // שמות בשפת המשתמש (מהשרת); escape — יש שמות עם ' ו-" (צ'רלטון, Newell's)
    const home = esc(m.home_name || m.home), away = esc(m.away_name || m.away);
    const lg = matchLeague(m);
    const star = team => isFav(lg, team) ? '⭐ ' : '';
    // הבית ראשון בכיוון הקריאה — בכל שפה (RTL: מימין, LTR: משמאל)
    return `
      <div class="match-card ${cardClass}"
           data-id="${m.id}" data-home="${home}"
           data-away="${away}" data-is-over="${m.is_over}"
           data-league="${lg}" data-home-key="${esc(m.home)}" data-away-key="${esc(m.away)}">
        <div class="team home"><div class="team-name">${star(m.home)}${home}</div></div>
        <div class="match-meta">
          <div class="match-time ${timeClass}">${isLive ? 'LIVE' : m.time}</div>
          <div class="match-vs">VS</div>
          <div class="venue">${m.venue||''}</div>
        </div>
        <div class="team away"><div class="team-name">${star(m.away)}${away}</div></div>
        ${badge}
      </div>`;
  }

  function bindMatchCards(container) {
    container.querySelectorAll('.match-card').forEach(card => {
      card.addEventListener('click', () => {
        favCtx = { league: card.dataset.league,
                   home: card.dataset.homeKey, homeName: card.dataset.home,
                   away: card.dataset.awayKey, awayName: card.dataset.away };
        openMatchModal(card.dataset.id, card.dataset.home,
                       card.dataset.away, card.dataset.isOver === 'true');
      });
    });
  }

  function renderMatches(matches, scroll = true) {
    const container = document.getElementById('matches-container');
    const countEl   = document.getElementById('match-count');

    if (!matches.length) {
      container.innerHTML = `<div class="empty">${t('no_matches')}<br><small style="opacity:0.6">${t('no_matches_hint')}</small></div>`;
      countEl.textContent = '';
      return;
    }

    countEl.textContent = t('n_matches', { n: matches.length });
    // משחקי קבוצות מועדפות — קודם, בקבוצה משלהם; השאר לפי תאריך כרגיל
    const favMs = matches.filter(isFavMatch);
    const groups = groupByDate(matches.filter(m => !isFavMatch(m)));
    let html = favMs.length ? favGroupHTML(favMs) : '';
    let todayGroupId = null;

    for (const [date, dayMatches] of Object.entries(groups)) {
      const today     = isToday(date);
      const yesterday = isYesterday(date);
      const weekday   = dayName(parseDateStr(date));
      const groupId   = `date-${date.replace(/\//g,'-')}`;
      if (today) todayGroupId = groupId;

      html += `<div class="date-group" id="${groupId}">
        <div class="date-label">
          <span class="weekday">${weekday}</span>
          <span>${date}</span>
          ${today ? `<span class="is-today">${t('today')}</span>` : ''}
          ${yesterday ? `<span class="is-today" style="background:var(--muted)">${t('yesterday')}</span>` : ''}
        </div>`;

      for (const m of dayMatches) {
        html += matchCardHTML(m);
      }
      html += '</div>';
    }

    container.innerHTML = html;

    // Scroll to today
    if (todayGroupId && scroll) {
      setTimeout(() => {
        const el = document.getElementById(todayGroupId);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 100);
    }

    bindMatchCards(container);
  }

  // ── Data: מציגים מיד (קאש מקומי), מרעננים ברקע ─────
  // הלוח כמעט קבוע — אין סיבה שהמסך יחכה לרשת. כל ליגה נשמרת
  // ב-localStorage ומוצגת מיידית; הרשת רק מעדכנת בשקט.

  const leagueData = {};   // league -> רשימת המשחקים המלאה

  function cacheGet(league) {
    try { return JSON.parse(localStorage.getItem('sf:m:' + LANG + ':' + league)); }
    catch (e) { return null; }
  }
  function cachePut(league, data) {
    try { localStorage.setItem('sf:m:' + LANG + ':' + league, JSON.stringify(data)); }
    catch (e) {}
  }
  function setSyncNote(text) {
    document.getElementById('sync-note').textContent = text || '';
  }

  // מציג ליגה מתוך הרשימה המלאה. background=true: עדכון שקט —
  // שומר על המחזור שנבחר ולא גולל.
  function showLeague(league, matches, background = false) {
    leagueData[league] = matches;
    if (league !== currentLeague) return;
    const withMd = matches.filter(m => m.matchday);

    // אין נתוני מחזור לליגה הזו — תצוגת תאריכים רגילה
    if (!withMd.length) {
      showMatchdayNav(false);
      renderMatches(matches, !background);
      return;
    }

    showMatchdayNav(true);
    matchdayList = [...new Set(withMd.map(m => parseInt(m.matchday)))]
                     .sort((a, b) => a - b);
    if (!(background && matchdayList.includes(currentMatchday))) {
      // "המחזור הרלוונטי": הראשון שיש בו משחק שטרם נגמר.
      // אם הכל נגמר (סוף עונה / נתונים ישנים) — המחזור האחרון.
      let chosen = matchdayList[matchdayList.length - 1];
      for (const md of matchdayList) {
        if (withMd.some(m => parseInt(m.matchday) === md && !m.is_over)) { chosen = md; break; }
      }
      currentMatchday = chosen;
    }
    buildMatchdaySelect();
    updateMatchdayUI();
    renderMatchday(!background);
  }

  function renderMatchday(scroll = true) {
    const ms = (leagueData[currentLeague] || [])
      .filter(m => parseInt(m.matchday) === currentMatchday);
    renderMatches(ms, scroll);
  }

  async function openLeague(league) {
    setSyncNote('');
    updateRefreshBtn();
    const cached = cacheGet(league);
    if (cached && cached.matches) showLeague(league, cached.matches);
    else document.getElementById('matches-container').innerHTML = `<div class="loading">${t('loading_matches')}</div>`;

    let data;
    try {
      data = await apiFetch(`${API}/matches/${league}?lang=${LANG}`).then(r => r.json());
    } catch (err) {
      if (err.message === 'auth' || league !== currentLeague) return;
      if (cached) setSyncNote(t('offline_cached'));
      else document.getElementById('matches-container').innerHTML =
        `<div class="error">${t('error')}: ${err.message}</div>`;
      return;
    }
    cachePut(league, data);
    showLeague(league, data.matches, !!cached);

    // נתונים מיושנים (3+ שעות) או ריקים — רענון ברקע, פעם אחת לליגה לביקור.
    // המסך כבר מציג את מה שיש; הרענון רק מעדכן בשקט כשהוא מסתיים.
    if ((data.stale || !data.matches.length) && !autoRefreshed.has(league)) {
      autoRefreshed.add(league);
      refreshLeague(league);
    }
  }

  // ── רענון (ברקע — המסך לא נחסם) ─────────────────────

  const refreshing = new Map();   // league -> promise של רענון שרץ עכשיו

  function updateRefreshBtn() {
    const btn = document.getElementById('refresh-btn');
    const busy = refreshing.has(currentLeague);
    btn.disabled = busy;
    btn.textContent = busy ? t('refreshing') : t('refresh');
  }

  // מחזיר promise — מי שקורא בזמן שרענון כבר רץ מחכה לאותו רענון
  // (חלון משחק / "לפי יום" / כפתור ↻ — בלי רענונים כפולים)
  function refreshLeague(league) {
    if (!refreshing.has(league)) {
      refreshing.set(league, runLeagueRefresh(league)
        .finally(() => { refreshing.delete(league); updateRefreshBtn(); }));
      updateRefreshBtn();
    }
    return refreshing.get(league);
  }

  async function runLeagueRefresh(league) {
    if (league === currentLeague) setSyncNote(t('updating_bg'));
    let note = '';
    try {
      let data;
      if (SPORTSDB_LEAGUES[league]) {
        // sportsdb חסום מ-Render — הדפדפן שולף ושולח לשרת
        const res = await clientRefreshSportsdb(league);
        note = res.fresh ? t('refreshed', { d: res.diag }) : t('refresh_empty');
        data = await apiFetch(`${API}/matches/${league}?lang=${LANG}`).then(r => r.json());
      } else {
        // football-data — שליפה מצד השרת (לא חסום); התשובה כבר מכילה הכל
        data = await apiFetch(`${API}/matches/${league}?refresh=true&lang=${LANG}`).then(r => r.json());
      }
      cachePut(league, data);
      showLeague(league, data.matches, true);
    } catch (e) {
      note = e.message === 'auth' ? '' : t('refresh_failed');
    }
    if (league === currentLeague) setSyncNote(note);
  }

  function doRefresh() {
    refreshLeague(currentLeague);
  }

  // ── Client-side refresh (TheSportsDB חסום מ-Render) ─

  async function clientRefreshSportsdb(league) {
    const cfg = SPORTSDB_LEAGUES[league];
    // מפתח "123" מחזיר יותר נתונים מ-"3" (15 מול 5 ב-eventsseason)
    const BASE = 'https://www.thesportsdb.com/api/v1/json/123/';
    const events = [];
    const counts = { past: 0, next: 0, rounds: 0 };

    async function grab(ep, label) {
      try {
        const r = await fetch(BASE + ep);
        const j = await r.json();
        const ev = (j && j.events) || [];
        events.push(...ev);
        counts[label] += ev.length;
        return ev;
      } catch (e) { return []; }
    }

    // הבקשות רצות במקביל (היה טור של ~7 בקשות רצופות)
    await Promise.all(cfg.ids.map(async id => {
      // 1. אחרונים — גם נתונים וגם זיהוי המחזור הנוכחי; 2. הבאים
      const [past] = await Promise.all([
        grab(`eventspastleague.php?id=${id}`, 'past'),
        grab(`eventsnextleague.php?id=${id}`, 'next'),
      ]);
      // 3. חלון מחזורים: eventsround עוקף את תקרת eventsseason —
      //    מחזור שלם (~10 משחקים) נכנס מתחת לתקרה
      let maxRound = 0;
      for (const e of past) {
        const r = parseInt(e.intRound || 0);
        if (r > maxRound) maxRound = r;
      }
      const rounds = [];
      for (let r = Math.max(1, maxRound - 1); r <= maxRound + 3; r++) rounds.push(r);
      await Promise.all(rounds.map(r =>
        grab(`eventsround.php?id=${id}&r=${r}&s=${cfg.season}`, 'rounds')));
    }));

    // סינון משחקים ישנים מ-14 יום — מנקה שאריות מסבבים קודמים
    // (בארגנטינה מחזור N קיים גם ב-Apertura מינואר וגם ב-Clausura הנוכחי)
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 14);
    const fresh = events.filter(e => e.dateEvent && new Date(e.dateEvent) >= cutoff);

    if (fresh.length) {
      await apiFetch(`${API}/refresh/${league}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ events: fresh, purge: true }),
      });
    }
    // דיאגנוסטיקה: כמה החזיר כל endpoint של TheSportsDB
    const diag = Object.entries(counts).map(([k, v]) => `${t('diag_' + k)}: ${v}`).join(' · ');
    return { fresh: fresh.length, diag };
  }

  // ── Modal ──────────────────────────────────────────

  let currentMatchId = null;   // למעקב: לאיזה משחק שייכת לחיצה על תקציר
  let currentNames = ['', ''];  // שמות הקבוצות בחלון הפתוח (לכפתור "חפש שוב")

  function openMatchModal(matchId, home, away, isOver, retried = false) {
    currentMatchId = matchId;
    currentNames = [home, away];
    if (!retried) track('match_open', { match_id: matchId,
                          league: currentLeague === '__byday' ? null : currentLeague });
    const modal = document.getElementById('modal');
    const title = document.getElementById('modal-title');
    const body  = document.getElementById('modal-body');

    title.textContent = `${home} ${t('vs')} ${away}`;
    renderFavRow();

    // תמיד פונים לשרת — גם אם הרשימה חושבת שהמשחק לא נגמר.
    // הסטטוס ברשימה עלול להיות מיושן; השרת יודע לרענן אוטומטית
    // (football-data) או להחזיר הודעה מדויקת עם הנחיה.
    body.innerHTML = `<div class="loading">${t('searching')}</div>`;
    modal.classList.add('open');

    apiFetch(`${API}/highlights/${matchId}?lang=${LANG}`)
      .then(r => r.json())
      .then(data => {
        if (!data.available) {
          if (data.needs_refresh && !retried) {
            // הסטטוס ב-DB מיושן — מרעננים את הליגה מכאן ופותחים שוב.
            // עובד מכל עמוד (גם "לפי יום"), בלי לשלוח את המשתמש לטאב הליגה.
            body.innerHTML = `<div class="loading">${t('updating_results')}</div>`;
            refreshLeague(data.league_key).then(() => {
              const stillOpen = currentMatchId === matchId &&
                document.getElementById('modal').classList.contains('open');
              if (stillOpen) openMatchModal(matchId, home, away, isOver, true);
              if (currentLeague === '__byday') loadDay();
            });
            return;
          }
          const reason = data.reason_code ? t('reason_' + data.reason_code) : data.reason;
          body.innerHTML = `<div class="no-highlight-msg">⏳ ${reason}</div>`;
          return;
        }

        const allBtns = [];
        let hasChannel = false;
        for (const source of data.sources) {
          if (source.status !== 'no_channel') hasChannel = true;
          if (!source.videos || !source.videos.length) continue;
          for (const v of source.videos) {
            // תמיד מציגים את סוג התקציר — שקיפות מלאה על מה לוחצים
            const label = `${srcName(source)} — ${kindLabel(v)}`;
            if (source.allow_embed) {
              allBtns.push(
                `<button class="play-btn ${v.extended ? 'extended' : ''}"
                         onclick="loadVideo('${v.video_id}')">▶ ${label}</button>`);
            } else {
              // embed חסום — פותחים ביוטיוב בטאב חדש
              allBtns.push(
                `<button class="play-btn ${v.extended ? 'extended' : ''}"
                         onclick="openOnYoutube('${v.video_id}')">▶ ${label} ↗</button>`);
            }
          }
        }

        // כפתורי אתר (ספורט1/וואלה/ספורט5) — קפיצה לתוצאה ראשונה
        const webBtns = (data.web_links || []).map(l =>
          `<button class="retry-btn" onclick="openWeb('${l.url}','${l.name}')">🔗 ${srcName(l)} ↗</button>`);
        const webRow = webBtns.length
          ? `<div class="sources-row">${webBtns.join('')}</div>
             <div class="shield-note">${t('web_note')}</div>`
          : '';

        if (!hasChannel && !webBtns.length) {
          body.innerHTML = `
            <div class="no-highlight-msg">
              ${t('no_source')}
              <br><small style="opacity:0.5">${t('no_source_hint')}</small>
            </div>`;
          return;
        }

        if (!allBtns.length) {
          body.innerHTML = `
            <div class="video-container">
              <div class="spoiler-shield">
                <div class="shield-icon">🔍</div>
                <div class="shield-text">${t('not_uploaded')}</div>
                ${webRow}
                <button class="retry-btn" onclick="retryHighlights('${matchId}')">${t('try_again')}</button>
              </div>
            </div>`;
          return;
        }

        body.innerHTML = `
          <div class="video-container">
            <div class="spoiler-shield" id="shield">
              <div class="shield-icon">🛡️</div>
              <div class="shield-text">${t('choose_version')}</div>
              <div class="sources-row">${allBtns.join('')}</div>
              <div class="shield-note">${t('opens_youtube')}</div>
              ${webRow}
              <button class="retry-btn" style="opacity:0.6"
                      onclick="retryHighlights('${matchId}')">${t('search_again')}</button>
            </div>
            <div id="video-frame"></div>
          </div>`;
      })
      .catch(err => {
        if (err.message === 'auth') return;
        body.innerHTML = `<div class="no-highlight-msg">${t('search_error')}</div>`;
      });
  }

  // השמות נלקחים מהחלון הפתוח — לא עוברים דרך onclick (שמות עם ')
  async function retryHighlights(matchId) {
    try {
      await apiFetch(`${API}/cache/${matchId}`, { method: 'DELETE' });
    } catch(e) {}
    openMatchModal(matchId, currentNames[0], currentNames[1], true);
  }

  function openOnYoutube(videoId) {
    track('highlight_play', { match_id: currentMatchId, detail: videoId });
    window.open(`https://www.youtube.com/watch?v=${videoId}`, '_blank');
  }

  function loadVideo(videoId) {
    track('highlight_play', { match_id: currentMatchId, detail: videoId });
    document.getElementById('shield').style.display = 'none';
    document.getElementById('video-frame').innerHTML = `
      <iframe
        src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
        allowfullscreen></iframe>`;
  }

  function openWeb(url, name) {
    track('web_link', { match_id: currentMatchId, detail: name });
    window.open(url, '_blank');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
    const f = document.getElementById('video-frame');
    if (f) f.innerHTML = '';
  }

  // ── תצוגת "לפי יום" ─────────────────────────────────

  let currentDay = new Date();

  function isoDay(d) {
    const pad = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }

  function enterDayView() {
    showMatchdayNav(false);
    document.getElementById('day-nav').classList.remove('hidden');
    document.getElementById('refresh-btn').style.display = 'none';
    setSyncNote('');
    currentDay = new Date();
    loadDay();
  }

  function exitDayView() {
    document.getElementById('day-nav').classList.add('hidden');
    document.getElementById('refresh-btn').style.display = '';
  }

  function updateDayUI() {
    const iso = isoDay(currentDay), todayIso = isoDay(new Date());
    const [y, mo, d] = iso.split('-');
    let label = `${dayName(currentDay)} · ${d}/${mo}`;
    if (iso === todayIso) label += ` (${t('today')})`;
    document.getElementById('day-label').textContent = label;
    document.getElementById('day-today').disabled = iso === todayIso;
  }

  async function loadDay() {
    updateDayUI();
    const container = document.getElementById('matches-container');
    container.innerHTML = `<div class="loading">${t('loading_matches')}</div>`;
    try {
      const data = await apiFetch(`${API}/matches/by_date/${isoDay(currentDay)}?lang=${LANG}`)
                     .then(r => r.json());
      renderDayMatches(data.matches);

      // משחקים שהפתיחה שלהם עברה אבל עדיין לא מסומנים כגמורים — מרעננים את
      // הליגות שלהם ברקע (פעם אחת לליגה לביקור) ומציגים שוב עם תגי "תקציר"
      const stale = [...new Set(data.matches.filter(m => m.needs_refresh)
                                            .map(m => m.league_key))]
                      .filter(lk => !autoRefreshed.has(lk));
      if (stale.length) {
        stale.forEach(lk => autoRefreshed.add(lk));
        document.getElementById('match-count').textContent += ` · ⏳ ${t('updating_results')}`;
        Promise.all(stale.map(lk => refreshLeague(lk)))
          .then(() => { if (currentLeague === '__byday') loadDay(); });
      }
    } catch (err) {
      if (err.message === 'auth') return;
      container.innerHTML = `<div class="error">${t('error')}: ${err.message}</div>`;
    }
  }

  function renderDayMatches(matches) {
    const container = document.getElementById('matches-container');
    const countEl   = document.getElementById('match-count');
    if (!matches.length) {
      container.innerHTML = `<div class="empty">${t('no_matches_day')}<br>` +
        `<small style="opacity:0.6">${t('no_matches_day_hint')}</small></div>`;
      countEl.textContent = '';
      return;
    }
    countEl.textContent = t('n_matches', { n: matches.length });
    lastDayMatches = matches;
    // קודם "מועדפים" (מכל הליגות), אחר כך לפי ליגה — בלי כפילויות.
    // השרת כבר מיין: סדר ליגות ואז שעה — נשאר רק לקבץ לכותרות
    const favMs = matches.filter(isFavMatch);
    let html = favMs.length ? favGroupHTML(favMs) : '', lastLeague = null;
    for (const m of matches.filter(m => !isFavMatch(m))) {
      if (m.league_key !== lastLeague) {
        if (lastLeague !== null) html += '</div>';
        html += `<div class="date-group">
          <div class="date-label"><span class="weekday">${t('lg_' + m.league_key)}</span></div>`;
        lastLeague = m.league_key;
      }
      html += matchCardHTML(m);
    }
    if (lastLeague !== null) html += '</div>';
    container.innerHTML = html;
    bindMatchCards(container);
  }

  // ── Events ─────────────────────────────────────────

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentLeague = tab.dataset.league;
      if (currentLeague === '__byday') { enterDayView(); track('day_view'); }
      else { exitDayView(); openLeague(currentLeague); track('league_view', { league: currentLeague }); }
    });
  });

  document.getElementById('md-prev').addEventListener('click', () => {
    const idx = matchdayList.indexOf(currentMatchday);
    if (idx > 0) { currentMatchday = matchdayList[idx-1]; updateMatchdayUI(); renderMatchday(); }
  });
  document.getElementById('md-next').addEventListener('click', () => {
    const idx = matchdayList.indexOf(currentMatchday);
    if (idx >= 0 && idx < matchdayList.length-1) { currentMatchday = matchdayList[idx+1]; updateMatchdayUI(); renderMatchday(); }
  });
  document.getElementById('md-select').addEventListener('change', e => {
    currentMatchday = parseInt(e.target.value); updateMatchdayUI(); renderMatchday();
  });

  document.getElementById('day-prev').addEventListener('click', () => {
    currentDay.setDate(currentDay.getDate() - 1); loadDay();
  });
  document.getElementById('day-next').addEventListener('click', () => {
    currentDay.setDate(currentDay.getDate() + 1); loadDay();
  });
  document.getElementById('day-today').addEventListener('click', () => {
    currentDay = new Date(); loadDay();
  });

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('cookie-link').addEventListener('click', openCookies);
  document.getElementById('sheet-close').addEventListener('click', closeSheet);
  document.getElementById('sheet').addEventListener('click', e => { if (e.target === e.currentTarget) closeSheet(); });
  document.getElementById('modal').addEventListener('click', e => { if (e.target===e.currentTarget) closeModal(); });
  document.getElementById('refresh-btn').addEventListener('click', doRefresh);
  document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });

  // מתג שפה: נשמר במכשיר, הדף מתורגם ומוצג מחדש בלי טעינה
  document.getElementById('lang-select').addEventListener('change', e => {
    LANG = e.target.value;
    try { localStorage.setItem('sf:lang', LANG); } catch (err) {}
    applyStatic();
    updateRefreshBtn();
    loadUserBar();
    setSyncNote('');
    // שמות הקבוצות מגיעים מהשרת בשפה שנבחרה — טוענים מחדש
    if (currentLeague === '__byday') loadDay();
    else openLeague(currentLeague);
  });

  // ── Init ───────────────────────────────────────────
  applyStatic();
  enterDayView();
  // המועדפים תלויים במשתמש (חשבון / מכשיר) — אחרי שיודעים מי מחובר
  loadUserBar().then(loadFavorites).then(rerender);
  track('app_open');

  // PWA: הדף נשמר במכשיר ונפתח מיד גם כשהשרת ישן
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
</script>
</body>
</html>
