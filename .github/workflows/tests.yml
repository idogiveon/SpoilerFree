# בדיקות אוטומטיות על כל PR ועל כל push ל-main.
# PR מתמזג רק אחרי שהבדיקות כאן ירוקות.
name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
      - name: JS syntax (index.html + sw.js)
        run: |
          python -c "import re; s=open('index.html',encoding='utf-8').read(); open('/tmp/app.js','w').write(re.findall(r'<script>(.*?)</script>', s, re.S)[-1])"
          node --check /tmp/app.js
          node --check static/sw.js
